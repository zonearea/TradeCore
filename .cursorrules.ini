## 4. Adım Adım Uygulama Sırası

### Adım 1: Boş Solution ve Katmanların Kurulması
Terminalde şu komutlar sırayla çalıştırılmalıdır:
```bash
mkdir clean-core-template && cd clean-core-template
mkdir backend && cd backend
dotnet new sln -n CleanCore

dotnet new classlib -n CleanCore.Domain -o src/CleanCore.Domain
dotnet new classlib -n CleanCore.Application -o src/CleanCore.Application
dotnet new classlib -n CleanCore.Infrastructure -o src/CleanCore.Infrastructure
dotnet new webapi -n CleanCore.WebApi -o src/CleanCore.WebApi

dotnet sln add src/CleanCore.Domain src/CleanCore.Application src/CleanCore.Infrastructure src/CleanCore.WebApi

dotnet add src/CleanCore.Application reference src/CleanCore.Domain
dotnet add src/CleanCore.Infrastructure reference src/CleanCore.Application
dotnet add src/CleanCore.WebApi reference src/CleanCore.Infrastructure