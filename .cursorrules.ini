# PROJE TALİMAT DOSYASI: Clean Core Template (.NET 9 + Next.js 15)

Bu dosya, Cursor AI için ana mimari kılavuz ve proje geliştirme şartnamesidir. 
Tüm kod üretimi buradaki kurallara sıkı sıkıya bağlı kalacaktır.

---

## 1. Proje Amacı ve Kapsamı
Production-ready, Clean Architecture prensiplerine tam uyumlu, full-stack bir başlangıç şablonu (Boilerplate) inşa edilecektir.
- Backend: .NET 9 (ASP.NET Core Web API)
- Frontend: Next.js 15 (App Router, React 19, TypeScript, Tailwind CSS, shadcn/ui)
- Veritabanı & ORM: PostgreSQL + Entity Framework Core
- Kimlik Doğrulama: JWT (Access Token) + Refresh Token Rotation (HttpOnly Cookies)
- Konteynerizasyon: Docker Compose (Postgres, API, Web tek komutla)

---

## 2. Cursor İçin Katı Mimari Kurallar (.cursorrules)
Aşağıdaki kurallar kesinlikle ihlal edilmeyecektir:

1. Katman İzolasyonu:
   - `Domain` katmanı hiçbir harici pakete veya veritabanı kütüphanesine bağımlı olamaz. Yalnızca saf C# tipleri içerir.
   - `Application` katmanı doğrudan EF Core veya DbContext referansı alamaz. Yalnızca `IApplicationDbContext` arayüzü üzerinden konuşur.
   - `WebApi` (Controllers/Endpoints) katmanı iş mantığı içermez; istekleri yalnızca MediatR üzerinden Application katmanına iletir.

2. Hata Yönetimi ve Result Pattern:
   - İş akışı içerisinde asla kontrol amaçlı `throw new Exception()` kullanılmayacaktır.
   - Tüm Command ve Query handler'ları `Result<T>` veya `Result.Failure(Error)` döndürmelidir.
   - Beklenmeyen sistem hataları `GlobalExceptionMiddleware` tarafından RFC 7807 (Problem Details) formatında yakalanacaktır.

3. CQRS ve Doğrulama:
   - Her iş operasyonu MediatR `Command` veya `Query` olarak yazılmalıdır.
   - Doğrulama kuralları `FluentValidation` ile yazılmalı ve MediatR `ValidationBehavior` üzerinden otomatik devreye girmelidir.

4. Güvenlik Standartları:
   - Şifreler BCrypt ile hash'lenmelidir.
   - Token'lar tarayıcıda `localStorage` yerine güvenli `HttpOnly, Secure, SameSite=Lax` çerezlerde tutulacaktır.

