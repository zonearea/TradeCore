# TradeCore — Python FastAPI & Clean Architecture Kuralları

Bu dosya, TradeCore projesini yerel-öncelikli (Local-First), sıfır sunucu maliyetli, yüksek veri işleme kabiliyetine sahip Python FastAPI + SQLite ve Next.js 15 mimarisinde geliştirmek için ana mimari anayasadır.
Cursor AI (Composer / Agent) bu kurallara kesinlikle uymak zorundadır.

---

## 1. Temel Mimari ve Teknoloji Yığını
- **Backend:** Python 3.11+ ve FastAPI.
- **Veritabanı:** Yerel SQLite (`tradecore.db`) ve SQLModel (Pydantic + SQLAlchemy).
- **Frontend:** Next.js 15 (App Router), React 19, TypeScript, Tailwind CSS, shadcn/ui.
- **Dış Entegrasyonlar:**
  - `yfinance`: BIST hisseleri (.IS), altın ve döviz canlı piyasa verileri.
  - `pdfplumber` & `openpyxl`: Banka hesap özetleri (PDF/Excel) ayrıştırma.
  - `google-generativeai` (Gemini API): Portföy analizi ve finansal tavsiye niteliği taşımayan raporlama.
  - `python-telegram-bot`: Arka planda çalışan asenkron mobil komut dinleyicisi.

---

## 2. Katman İzolasyonu ve Klasör Sorumlulukları
Kodlar mantıksal katmanlara kesin sınırlarla ayrılmalıdır:
- `backend/app/core/`: Yapılandırma (`config.py`), güvenlik, BCrypt şifreleme ve JWT token üretimi (`security.py`).
- `backend/app/models/`: Veritabanı tabloları ve Pydantic veri modelleri (`user.py`, `portfolio.py`, `statement.py`, `ai_report.py`).
- `backend/app/services/`: İş mantıkları ve harici kütüphane entegrasyonları (`market_service.py`, `parser_service.py`, `ai_service.py`, `telegram_bot.py`).
- `backend/app/api/`: İstemciden gelen istekleri karşılayan FastAPI route kontrolcüleri (`auth.py`, `portfolio.py`, `parser.py`, `analysis.py`).
- `backend/main.py`: Uygulamanın giriş noktası, CORS ayarları ve SQLite tablolarının otomatik başlatılması.

---

## 3. Frontend ve Kimlik Doğrulama Uyumluluğu
Next.js 15 frontend arayüzünün mevcut auth akışı bozulmayacaktır:
- `POST /api/auth/register`, `POST /api/auth/login`, `POST /api/auth/logout`, `GET /api/auth/me` uçları birebir aynı JSON formatında ve `Path=/` HttpOnly çerezi (`refreshToken`) ile çalışmalıdır.
- Hata yanıtları standart JSON formatında (`{"detail": "Hata açıklaması"}`) dönmelidir.

---

## 4. Hata Yönetimi ve Dayanıklılık (Resilience)
- **Anahtar Yoksa Çökme:** `GEMINI_API_KEY` veya `TELEGRAM_BOT_TOKEN` tanımlanmamışsa ana web API'si asla çökmemeli; yapay zeka uçları `503 Service Unavailable` dönmeli, Telegram botu ise sessizce devre dışı kalmalıdır.
- **Finansal Hassasiyet:** Para ve lot hesaplamalarında asla yuvarlama hatası yapan `float` kullanılmamalı; `decimal` veya kuruş bazlı tam sayı (`integer`) modelleri tercih edilmelidir.

---

## 5. Eğitici ve Açıklayıcı Kod Yorumları (Code Comments - ZORUNLU)
- Yazılan veya güncellenen **tüm fonksiyonlarda, sınıflarda ve iş mantıklarında mutlaka Türkçe açıklayıcı yorum satırları** bulunmalıdır.
- Yorum satırlarında şunlar açıkça belirtilmelidir:
  1. Bu fonksiyon veya sınıfın **ne yaptığı**,
  2. Hangi **mimari amaçla** yazıldığı,
  3. Parametrelerin ve dönüş değerlerinin **ne anlama geldiği**,
  4. Karmaşık satırların arkasında dönen mantık adım adım bir öğrenciye ders anlatır gibi basit, duru ve eğitici bir dille satır aralarına eklenmelidir.