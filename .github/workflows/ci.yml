name: CI

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore backend/CleanCore.sln

      - name: Build
        run: dotnet build backend/CleanCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/CleanCore.sln --configuration Release --no-build
